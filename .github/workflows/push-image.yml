name: Push server image to Docker Hub

# Builds log-sump's own image and pushes it to the registry ref in
# _repo/image.json (osteck/log-sump). Lives here (not in the main
# cut-to-the-chase repo) since this repo is what actually publishes
# releases -- but the Docker build context (app/server-logsump/, a
# submodule of cut-to-the-chase) is source code that only exists there, so
# that repo is checked out (with submodules) purely to provide it, then
# releases/_shared/build-image.sh (this repo's own build script -- checked
# out into it at that same relative path, since it's a submodule of
# cut-to-the-chase too) does the actual build + tag + push.
#
# Manual for now: trigger from the Actions tab (or `gh workflow run`) on
# this (cttc-release) repo.
on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cut-to-the-chase (app/server-logsump source + this repo's own releases/ submodule)
        uses: actions/checkout@v4
        with:
          repository: oliben67/cut-to-the-chase
          submodules: true
          path: cut-to-the-chase

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PWD }}" | docker login --username osteck@gmail.com --password-stdin

      - name: Build + push log-sump's image
        run: bash cut-to-the-chase/releases/_shared/build-image.sh
